services:
  - type: web
    name: n8n-app
    runtime: image
    image:
      url: n8nio/n8n:latest
    plan: free
    envVars:
      - key: PORT
        value: "5678"
      - key: DB_TYPE
        value: postgresdb
      - key: DB_POSTGRESDB_HOST
        fromDatabase:
          name: postgres_db
          property: host
      - key: DB_POSTGRESDB_PORT
        fromDatabase:
          name: postgres_db
          property: port
      - key: DB_POSTGRESDB_DATABASE
        fromDatabase:
          name: postgres_db
          property: database
      - key: DB_POSTGRESDB_USER
        fromDatabase:
          name: postgres_db
          property: user
      - key: DB_POSTGRESDB_PASSWORD
        fromDatabase:
          name: postgres_db
          property: password
      - key: N8N_ENCRYPTION_KEY
        generateValue: true
      - key: GENERIC_TIMEZONE
        value: Asia/Kolkata
      - key: TZ
        value: Asia/Kolkata
      - key: WEBHOOK_URL
        sync: false

  - type: web
    name: whatsapp-evolution
    runtime: image
    image:
      url: evoapicloud/evolution-api:latest
    plan: free
    envVars:
      - key: PORT
        value: "8080"
      - key: SERVER_URL
        sync: false
      - key: AUTHENTICATION_TYPE
        value: apikey
      - key: AUTHENTICATION_API_KEY
        generateValue: true
      - key: DATABASE_ENABLED
        value: "true"
      - key: DATABASE_PROVIDER
        value: postgresql
      - key: DATABASE_CONNECTION_URI
        fromDatabase:
          name: postgres_db
          property: connectionString
      - key: DATABASE_SAVE_DATA_INSTANCE
        value: "true"
      - key: DATABASE_SAVE_DATA_NEW_MESSAGE
        value: "true"
      - key: DATABASE_SAVE_MESSAGE_UPDATE
        value: "true"
      - key: DATABASE_SAVE_DATA_CONTACTS
        value: "true"
      - key: DATABASE_SAVE_DATA_CHATS
        value: "true"
      - key: CACHE_REDIS_ENABLED
        value: "true"
      - key: CACHE_REDIS_URI
        fromService:
          type: keyvalue
          name: redis-cache
          property: connectionString
      - key: CACHE_REDIS_PREFIX_KEY
        value: evolution
      - key: CACHE_REDIS_SAVE_INSTANCES
        value: "false"
      - key: CACHE_LOCAL_ENABLED
        value: "false"
      - key: CONFIG_SESSION_PHONE_CLIENT
        value: Evolution API
      - key: CONFIG_SESSION_PHONE_NAME
        value: Chrome

  - type: keyvalue
    name: redis-cache
    plan: free
    ipAllowList: []

databases:
  - name: postgres_db
    plan: free
    databaseName: n8n_db
    user: admin
    ipAllowList: []
